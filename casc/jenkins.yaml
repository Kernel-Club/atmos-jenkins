# Jenkins controller configuration (JCasC). Applied at every start; changes made in the web interface are overwritten.
# No secrets here: values like ${NAME} are read from the environment or from files at start.

jenkins:
  systemMessage: "Welcome to Atmos CI, the build platform of Atmos. Settings live in Git (atmos-jenkins): changes made here are reset at the next restart."

  # One build at a time, on the built-in node.
  numExecutors: 1

  # Only the admin account; it is created and its password reset at every start.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}

  # Signed-in users can do everything; anonymous users get nothing, not even read access.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # CSRF protection.
  crumbIssuer: standard

  # No inbound agents: builds run on the built-in node.
  slaveAgentPort: -1

credentials:
  system:
    domainCredentials:
      - credentials:
          # Nexus user that pushes images (created by atmos-ansible, roles/nexus).
          - usernamePassword:
              scope: GLOBAL
              id: nexus-push
              username: jenkins-push
              password: ${NEXUS_PUSH_PASSWORD}
              description: Push images to the Nexus repository atmos-docker
          # SonarQube Cloud token "jenkins-atmos" (Ansible Vault): code analysis of atmos-dev.
          - string:
              scope: GLOBAL
              id: sonar-token
              secret: ${SONAR_TOKEN}
              description: Analysis of atmos-dev in SonarQube Cloud

appearance:
  # English for everyone, whatever language the browser asks for.
  locale:
    systemLocale: en
    ignoreAcceptLanguage: true
  # Dark theme for all users, with the Atmos colors and logo on top.
  themeManager:
    disableUserThemes: true
    theme: dark
  simpleTheme:
    elements:
      - cssUrl:
          url: /userContent/atmos.css
      - faviconUrl:
          url: /userContent/atmos-logo.svg

# Jobs as code (Job DSL), created at every start.
jobs:
  - file: /var/jenkins_config/jobs/atmos.groovy

unclassified:
  # Address of Jenkins behind Traefik, used in links and build notifications.
  location:
    url: https://jenkins.atmos.lan/
